<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOTTA7 PANEL - VIP EXCLUSIVE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050508;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .panel-container {
            background-color: #0f1015;
            border: 2px solid #ff0055;
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #ff0055;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.6);
        }

        p.subtitle {
            color: #8a99ad;
            font-size: 11px;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .key-box {
            margin-bottom: 18px;
            background: #141620;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #262a3b;
        }

        .key-box label {
            font-size: 11px;
            color: #ff0055;
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .key-box input {
            width: 100%;
            padding: 8px 12px;
            background: #0f1015;
            border: 1px solid #333b52;
            border-radius: 6px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }

        .section-title {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            margin: 15px 0 10px 0;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .option-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141620;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #262a3b;
        }

        .option-group span {
            font-weight: 600;
            font-size: 13px;
            color: #e2e8f0;
        }

        /* Switch toggle customizado en rojo/rosa neón */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #262a3b;
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #ff0055;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        .btn-action {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff0055 0%, #ff5e00 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
        }

        .btn-action:active {
            transform: scale(0.98);
        }

        .console-box {
            margin-top: 15px;
            background: #000;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11px;
            color: #ff0055;
            min-height: 50px;
            border: 1px solid #262a3b;
        }
    </style>
</head>
<body>

    <div class="panel-container">
        <div class="header">
            <h1>JOTTA7 PANEL</h1>
            <p class="subtitle">FREE FIRE - HACK MENU VIP</p>
        </div>

        <div class="key-box">
            <label for="vip-key">CLAVE DE ACCESO</label>
            <input type="text" id="vip-key" placeholder="Ingresa tu Key...">
        </div>

        <div class="section-title">Funciones de Precisión</div>

        <div class="option-group">
            <span>🎯 Auto Apuntado (Aimbot)</span>
            <label class="switch">
                <input type="checkbox" id="auto-aim">
                <span class="slider"></span>
            </label>
        </div>

        <div class="option-group">
            <span>🔴 Todo Rojo en el Pecho</span>
            <label class="switch">
                <input type="checkbox" id="red-chest">
                <span class="slider"></span>
            </label>
        </div>

        <div class="option-group">
            <span>📡 Antena View (Localizar Enemigos)</span>
            <label class="switch">
                <input type="checkbox" id="antena">
                <span class="slider"></span>
            </label>
        </div>

        <div class="section-title">Sistema y Rendimiento</div>

        <div class="option-group">
            <span>🚀 FPS Ultra 90Hz</span>
            <label class="switch">
                <input type="checkbox" id="fps">
                <span class="slider"></span>
            </label>
        </div>

        <div class="option-group">
            <span>🛡️ Anti-Lag / Regedit Pro</span>
            <label class="switch">
                <input type="checkbox" id="regedit">
                <span class="slider"></span>
            </label>
        </div>

        <button class="btn-action" onclick="inyectar()">INICIAR INYECCIÓN</button>

        <div class="console-box" id="console">
            [+] Esperando credenciales y selección...
        </div>
    </div>

    <script>
        function inyectar() {
            const consoleBox = document.getElementById('console');
            const key = document.getElementById('vip-key').value;

            if (key.trim() === "") {
                consoleBox.innerText = "[!] ERROR: Ingrese la Key de acceso.";
                consoleBox.style.color = "#ff4757";
                return;
            }

            consoleBox.style.color = "#ff0055";
            consoleBox.innerText = "[*] Conectando con los servidores de Free Fire...\n";

            setTimeout(() => {
                consoleBox.innerText += "[*] Aplicando Auto Apuntado y Antena...\n";
            }, 1000);

            setTimeout(() => {
                consoleBox.innerText += "[✔] ¡HACKS ACTIVADOS CORRECTAMENTE!";
            }, 2300);
        }
    </script>
</body>
</html>
